# Prebuilds and publishes the image suite to GHCR (spec: issue #7).
# base must publish before node: node's Dockerfile is FROM base:latest.
# No build cache on purpose — the weekly rebuild exists to pull fresh apt
# security updates, which a reused apt layer would silently skip.
name: Publish images

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: publish-images
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY_BASE: ghcr.io/dbarjs/agent-devcontainer

jobs:
  publish:
    name: Build & push (multi-arch)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      date-tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute date tag
        id: tag
        run: echo "tag=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Build & push base
        run: |
          devcontainer build \
            --workspace-folder images/base \
            --config images/base/devcontainer.json \
            --platform linux/amd64,linux/arm64 \
            --push \
            --image-name "$REGISTRY_BASE/base:latest" \
            --image-name "$REGISTRY_BASE/base:${{ steps.tag.outputs.tag }}"

      - name: Build & push node
        run: |
          devcontainer build \
            --workspace-folder images/node \
            --config images/node/devcontainer.json \
            --platform linux/amd64,linux/arm64 \
            --push \
            --image-name "$REGISTRY_BASE/node:latest" \
            --image-name "$REGISTRY_BASE/node:${{ steps.tag.outputs.tag }}"

      - name: Verify multi-arch manifests
        run: |
          set -euo pipefail
          for image in base node; do
            docker buildx imagetools inspect \
              "$REGISTRY_BASE/$image:${{ steps.tag.outputs.tag }}" | tee manifest.txt
            grep -q 'linux/amd64' manifest.txt
            grep -q 'linux/arm64' manifest.txt
          done

  # Post-publish validation (spec: issue #28): tier 2 container assertions
  # and tier 3 e2e run in parallel on the just-published date tag, native on
  # both arches. Passing e2e on both arches IS the final validation pass.
  container-test:
    name: Tier 2 container (${{ matrix.image }}, ${{ matrix.runner }})
    needs: publish
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [base, node]
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tier 2 container assertions
        run: >-
          tests/container/test.sh --pull
          "$REGISTRY_BASE/${{ matrix.image }}:${{ needs.publish.outputs.date-tag }}"
          "${{ matrix.image }}"

  e2e:
    name: Tier 3 e2e (${{ matrix.image }}, ${{ matrix.runner }})
    needs: publish
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [base, node]
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Ensure zsh on the runner
        run: command -v zsh || (sudo apt-get update -qq && sudo apt-get install -y -qq zsh)

      # exercise the real host entry point: adc init writes the template into
      # a temp project, then the image ref is pinned to the just-published
      # date tag. The node leg's package.json declares packageManager so the
      # guarded postCreateCommand actually runs ni (headless — a prompt hangs).
      - name: Init temp project with adc
        id: project
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          if [ "${{ matrix.image }}" = "node" ]; then
            printf '{"name":"e2e","version":"0.0.0","private":true,"packageManager":"pnpm@11.21.0"}' > "$tmp/package.json"
          fi
          zsh cli/adc init "$tmp" --variant "${{ matrix.image }}"
          sed -i \
            "s|/${{ matrix.image }}:latest|/${{ matrix.image }}:${{ needs.publish.outputs.date-tag }}|" \
            "$tmp/.devcontainer/devcontainer.json"
          grep -F "${{ needs.publish.outputs.date-tag }}" "$tmp/.devcontainer/devcontainer.json"
          cp -R tests "$tmp/tests"
          echo "dir=$tmp" >> "$GITHUB_OUTPUT"

      - name: devcontainer up
        run: >-
          devcontainer up
          --workspace-folder "${{ steps.project.outputs.dir }}"
          --id-label ci-e2e=agent-devcontainer

      - name: Run tier 3 checklist inside the container
        run: >-
          devcontainer exec
          --workspace-folder "${{ steps.project.outputs.dir }}"
          --id-label ci-e2e=agent-devcontainer
          bash tests/e2e/test.sh "${{ matrix.image }}"

      - name: Teardown by label
        if: always()
        run: |
          docker ps -aq --filter label=ci-e2e=agent-devcontainer \
            | xargs -r docker rm -f
